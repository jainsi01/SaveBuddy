<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sbBadgeBg" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2A1B14" />
      <stop offset="50%" stopColor="#1E130D" />
      <stop offset="100%" stopColor="#120A06" />
    </linearGradient>
    <linearGradient id="sbGoldSheen" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F9E8CE" />
      <stop offset="25%" stopColor="#E2BA84" />
      <stop offset="60%" stopColor="#C49A6C" />
      <stop offset="100%" stopColor="#8C5C35" />
    </linearGradient>
    <linearGradient id="sbBorderStroke" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#D4AF37" stopOpacity="0.7" />
      <stop offset="50%" stopColor="#8C5C35" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#D4AF37" stopOpacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Outer Squircle Container -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#sbBadgeBg)" stroke="url(#sbBorderStroke)" stroke-width="2.5" />

  <!-- Decorative Inner Accent Arc -->
  <path d="M 22 78 C 30 84, 70 84, 78 78" stroke="url(#sbGoldSheen)" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Dynamic 'S' Crest Wave -->
  <path d="M 64 30 C 58 24, 42 22, 34 30 C 26 38, 30 48, 48 52 C 68 56, 72 66, 64 74 C 54 84, 34 80, 28 72" stroke="url(#sbGoldSheen)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Counter-balanced 'B' Flow Loop -->
  <path d="M 44 26 L 44 74 C 56 74, 68 68, 68 59 C 68 52, 60 49, 52 49 C 64 49, 66 38, 64 34 C 61 28, 54 26, 44 26 Z" stroke="url(#sbGoldSheen)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" />

  <!-- Radiant Wealth Sparkle / Star -->
  <path d="M 72 20 Q 75 25, 80 28 Q 75 31, 72 36 Q 69 31, 64 28 Q 69 25, 72 20 Z" fill="#FDE68A" />
  <circle cx="72" cy="28" r="1.5" fill="#FFFFFF" />

  <!-- Growth Accent -->
